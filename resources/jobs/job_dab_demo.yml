resources:
  jobs:
    JOB_DAB_DEMO:
      name: JOB_DAB_DEMO
      tasks:
        - task_key: Run_the_sample_notebook
          notebook_task:
            notebook_path: ../notebooks/NB_Test.ipynb
            source: WORKSPACE
          job_cluster_key: Job_cluster
      job_clusters:
        - job_cluster_key: Job_cluster
          new_cluster:
            spark_version: 17.3.x-scala2.13
            azure_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK_AZURE
              spot_bid_max_price: -1
            node_type_id: Standard_D4ds_v4
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            num_workers: 1
      queue:
        enabled: true
