bundle:
  name: dabundle
  databricks_cli_version: ">= 0.299.0"
  git:
    origin_url: https://github.com/rohitmathw/dabtutorial.git
    branch: master

run_as:
  user_name: rohit.mathw@gmail.com

include:
  - src/*.yml
  - src/env/*.yml
  - resources/jobs/*.yml
  - resources/pipelines/*.yml
  - resources/schemas/*.yml

permissions:
  - user_name: rohit.mathw@gmail.com
    level: CAN_MANAGE

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405617536905273.13.azuredatabricks.net/
  
  prod:
    default: false
    workspace:
      host: https://adb-7405617536905273.13.azuredatabricks.net/